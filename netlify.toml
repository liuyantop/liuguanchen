# Netlify 部署配置 + 安全响应头
# 若使用其他平台，请将下方 [headers] 规则迁移为对应配置：
#   - Vercel:  vercel.json 的 "headers" 字段
#   - GitHub Pages: 需在 CDN/反向代理层设置（不支持仓库内声明）
#   - Cloudflare Pages: _headers 文件

[build]
  publish = "."
  command = "echo 'static site, no build step'"

[[headers]]
  for = "/*"
  [headers.values]
    # 默认仅允许同源资源；白名单：Google Fonts（字体+样式表）、B站播放器（iframe）
    Content-Security-Policy = '''
      default-src 'self';
      img-src 'self' data:;
      media-src 'self';
      font-src 'self' https://fonts.gstatic.com;
      style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
      script-src 'self';
      frame-src https://player.bilibili.com;
      connect-src 'self';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
      frame-ancestors 'none';
    '''
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
