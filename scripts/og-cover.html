<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <title>OG Cover Source</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: #f7f3ef;
            color: #181614;
        }

        .card {
            position: relative;
            width: 1200px;
            height: 630px;
            display: grid;
            grid-template-columns: 1fr 390px;
            gap: 56px;
            padding: 58px 70px 52px;
            background: linear-gradient(135deg, #fbfaf8 0%, #f1e8e1 48%, #e9f1f0 100%);
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(20, 20, 20, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(20, 20, 20, 0.045) 1px, transparent 1px);
            background-size: 52px 52px;
        }

        .accent {
            position: absolute;
            left: 0;
            top: 0;
            width: 12px;
            height: 630px;
            background: #d74332;
        }

        .left,
        .right {
            position: relative;
            z-index: 1;
        }

        .left {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
            color: #d74332;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d74332;
        }

        .name {
            font-family: Georgia, "Times New Roman", "Microsoft YaHei", serif;
            font-size: 76px;
            line-height: 1;
            margin: 30px 0 12px;
            font-weight: 700;
            color: #171412;
        }

        .en {
            font-size: 36px;
            font-weight: 700;
            color: #312d29;
            margin-bottom: 32px;
        }

        .title {
            font-size: 30px;
            line-height: 1.45;
            color: #3a3530;
            max-width: 660px;
            font-weight: 650;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 42px;
        }

        .tag {
            font-size: 22px;
            padding: 11px 18px;
            border: 1px solid rgba(215, 67, 50, 0.36);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.56);
            color: #2a2622;
        }

        .right {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .poster {
            width: 360px;
            height: 480px;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 28px 70px rgba(45, 30, 24, 0.28);
            border: 8px solid rgba(255, 255, 255, 0.82);
        }

        .mark {
            position: absolute;
            right: 52px;
            bottom: 42px;
            font-size: 22px;
            font-weight: 800;
            color: #d74332;
            background: #171412;
            border-radius: 14px;
            padding: 12px 16px;
            letter-spacing: 0.02em;
        }

        .url {
            position: absolute;
            left: 70px;
            bottom: 46px;
            font-size: 19px;
            color: #6c625a;
            font-weight: 600;
        }

        .line {
            position: absolute;
            left: 70px;
            bottom: 84px;
            width: 128px;
            height: 4px;
            background: #d74332;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <main class="card" aria-label="刘冠辰作品集分享图">
        <div class="grid"></div>
        <div class="accent"></div>
        <section class="left">
            <div class="eyebrow"><span class="dot"></span><span>数字媒体艺术 · VR/AR · 3D 视觉</span></div>
            <h1 class="name">刘冠辰</h1>
            <div class="en">Guanchen Liu</div>
            <div class="title">3D Visual &amp; VR/AR Interaction Designer<br>沉浸式交互、游戏叙事与 AI 辅助设计作品集</div>
            <div class="tags">
                <span class="tag">Blender</span>
                <span class="tag">Unity</span>
                <span class="tag">RPGMaker</span>
                <span class="tag">TouchDesigner</span>
                <span class="tag">AI-Assisted Design</span>
            </div>
        </section>
        <section class="right">
            <img class="poster" src="../assets/iphi/poster.webp" alt="IPHI poster">
        </section>
        <div class="line"></div>
        <div class="url">liuyantop.github.io/liuguanchen</div>
        <div class="mark">PORTFOLIO</div>
    </main>
</body>
</html>
