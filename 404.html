<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | 刘冠辰作品集</title>
    <meta name="theme-color" content="#0f0f0f">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a1a'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%23d32f23' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;600;700;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            color: #fafafa;
            font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
            padding: 24px;
        }
        .error-container {
            text-align: center;
            max-width: 520px;
        }
        .error-code {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(120px, 25vw, 200px);
            font-weight: 900;
            line-height: 0.9;
            color: #d32f23;
            letter-spacing: -4px;
        }
        .error-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 16px;
            color: #fafafa;
        }
        .error-desc {
            font-size: 0.95rem;
            color: #888;
            margin-top: 12px;
            line-height: 1.6;
        }
        .error-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 32px;
            padding: 14px 32px;
            background: #d32f23;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .error-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(211, 47, 35, 0.35);
        }
        .error-home svg { flex-shrink: 0; }
        @media (prefers-reduced-motion: reduce) {
            .error-home { transition: none; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">
            您访问的页面不存在或已移除。<br>
            The page you are looking for doesn't exist or has been moved.
        </p>
        <a href="/" class="error-home">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2l7 6v8a1 1 0 01-1 1h-3v-5H6v5H3a1 1 0 01-1-1V8l7-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <span>返回首页 / Back Home</span>
        </a>
    </div>
</body>
</html>
